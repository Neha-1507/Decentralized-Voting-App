name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Hardhat tests
        run: |
          if [ -f package.json ]; then
            npm ci || npm install
            npx hardhat test
          fi
      - name: Frontend build
        run: |
          if [ -f frontend/package.json ]; then
            cd frontend
            npm ci || npm install
            npm run build
          fi
